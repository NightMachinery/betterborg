* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {

}

a { color: var(--link); }
h1 { font-size: 1.65rem; line-height: 1.2; margin: 1rem 0 .5rem; }
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: .88em;
  background: var(--code-bg);
  padding: .08em .3em;
  border-radius: 4px;
}
.card {
  display: block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .8rem .95rem;
  margin: 1rem 0;
  color: inherit;
  text-decoration: none;
}
.card:hover { border-color: var(--accent); }
.card strong { color: var(--link); font-size: 1.1rem; }
.card span { display: block; color: var(--muted); margin-top: .2rem; }
footer { color: var(--muted); font-size: .9rem; margin-top: 1.5rem; }
